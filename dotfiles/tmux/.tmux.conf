# ==================================================================
# tmux.conf — Pedro (pedroiff0)
# Foco: trocar de janela SEM sujeira visual de outra janela.
# Recarregar: Ctrl+a r
# ==================================================================

# ------------------------------------------------------------------
# 1. BASE
# ------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"      # true color
set -g escape-time 10                          # sem lag no ESC (vim)
set -g focus-events on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on                     # fechar janela nao deixa buraco
set -g history-limit 200000

# ------------------------------------------------------------------
# 2. ANTI-SUJEIRA AO TROCAR DE JANELA  <<< O PROBLEMA PRINCIPAL
# ------------------------------------------------------------------
# Cada janela tem seu proprio buffer alternativo (nao mistura scrollback)
setw -g alternate-screen on

# Nao encolhe a janela pelo menor cliente conectado (evita reflow/lixo)
setw -g aggressive-resize on

# PORQUE UM SCRIPT E NAO refresh-client:
# `refresh-client` faz o TMUX redesenhar o cache que ele tem do pane — se o app
# (hermes/claude/agy) nunca reenviou nada, o tmux repinta a MESMA tela velha.
# `refresh-client -S` e pior: redesenha SO a status bar.
# SIGWINCH puro da repaint PARCIAL (Ink/React do Claude ignora se o tamanho
# nao mudou). O script faz resize -1col e volta -> repaint COMPLETO garantido.
set-hook -g after-select-window 'if -F "#{pane_in_mode}" "send-keys -X cancel" ; run-shell -b "~/.tmux/redraw-pane.sh #{window_id}"'
set-hook -g client-attached     'run-shell -b "~/.tmux/redraw-pane.sh #{window_id}"'
set-hook -g client-focus-in     'run-shell -b "~/.tmux/redraw-pane.sh #{window_id}"'
set-hook -g window-linked       'refresh-client'

# Prefix + R -> REDRAW manual de emergencia (limpa qualquer lixo na hora)
bind R run-shell -b "~/.tmux/redraw-pane.sh #{window_id}" \; display-message "tela redesenhada"

# Prefix + k -> limpa a tela E o scrollback da janela atual (reset total)
bind k send-keys -R \; clear-history \; refresh-client \; display-message "tela + historico limpos"

# ------------------------------------------------------------------
# 3. IDENTIFICACAO DE JANELAS (saber QUAL chat e qual)
# ------------------------------------------------------------------
# Rename automatico LIGADO, mas com formato util: app + DIRETORIO.
# python3 -> "hermes" (todo python3 aqui e o Hermes rodando).
# `rename-window` (Prefix + ,) desliga o autorename daquela janela sozinho,
# entao um nome manual PERMANECE e nunca e sobrescrito.
setw -g automatic-rename on
setw -g automatic-rename-format '#{s/^python3$/hermes/:pane_current_command}·#{?#{==:#{pane_current_path},#{HOME}},~,#{b:pane_current_path}}'
set  -g allow-rename off
set  -g set-titles on
set  -g set-titles-string '#S:#I #W'

# Prefix + , -> renomear janela (fixa o nome, desliga autorename)
bind , command-prompt -I "#W" "rename-window '%%'"
# Prefix + . -> VOLTAR pro nome automatico (app·dir)
bind . setw automatic-rename on \; display-message "nome automatico religado"

# Indicador de atividade: janela que produziu output fica marcada
setw -g monitor-activity on
set  -g visual-activity off
setw -g monitor-bell on
set  -g visual-bell off

# ------------------------------------------------------------------
# 4. MOUSE + COPY-MODE
# ------------------------------------------------------------------
set -g mouse on
setw -g mode-keys vi

bind -n WheelUpPane   if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'select-pane -t=; copy-mode -e'"
bind -n WheelDownPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'send-keys -M'"

bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi V send-keys -X select-line
bind -T copy-mode-vi r send-keys -X rectangle-toggle
bind -T copy-mode-vi Escape send-keys -X cancel
bind -T copy-mode-vi q send-keys -X cancel

# Copiar para o CLIPBOARD do sistema (xclip instalado)
bind -T copy-mode-vi y     send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Y     send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

bind C-y run-shell "xclip -selection clipboard -o | tmux load-buffer - && tmux paste-buffer"
set -g mode-style 'bg=#5b4b8a,fg=#ffffff,bold'

# Prefix + / -> busca no scrollback
bind / copy-mode \; send-keys ?

# ------------------------------------------------------------------
# 5. NAVEGACAO
# ------------------------------------------------------------------
bind -n M-Left  previous-window
bind -n M-Right next-window
bind -n M-n next-window
bind -n M-p previous-window
bind -n M-Tab last-window

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-0 select-window -t 10

# Nova janela / fechar (abre no diretorio atual)
bind -n M-c new-window -c "#{HOME}"
bind    c   new-window -c "#{HOME}"
bind -n M-x confirm-before -p "fechar janela #W? (y/n) " kill-window

# Paineis
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind C-k select-pane -U
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind Space next-layout
bind z resize-pane -Z

# Nova sessao destacada
bind -n M-N run-shell 'S=$(tmux new-session -d -P -s "s$(date +%H%M%S)"); tmux display-message "sessao criada: $S (Ctrl+a s p/ trocar)"'
bind S choose-tree -Zs

bind r source-file ~/.tmux.conf \; display-message "tmux config recarregado"

# ------------------------------------------------------------------
# 6. STATUS BAR (dark roxo, combinando com o resto)
# ------------------------------------------------------------------
set -g status on
set -g status-interval 5
set -g status-position bottom
set -g status-justify left

set -g status-left  '#[bg=#7c3aed,fg=#ffffff,bold] #S #[bg=#1e1b34,fg=#7c3aed]#[default] '
set -g status-left-length 30
set -g status-right '#{?client_prefix,#[bg=#7c3aed]#[fg=#ffffff] PREFIX #[default] ,}#(bash ~/.tmux/status-right.sh)'
set -g status-right-length 150

set -g window-status-separator ' #[fg=#a855f7]●#[default] '
# Janela inativa: cinza. Com atividade: ponto roxo.
setw -g window-status-format         ' #I:#W#{?window_activity_flag,•,} '
setw -g window-status-activity-style 'fg=#c4b5fd,bg=#1e1b34,bold'
# Janela ATIVA: barra roxa bem visivel
setw -g window-status-current-format '#[bg=#7c3aed,fg=#ffffff,bold] #I:#W #[default]'

set -g pane-border-style        'fg=#332f52'
set -g pane-active-border-style 'fg=#7c3aed'
set -g message-style            'bg=#7c3aed,fg=#ffffff,bold'
set -g display-time 1500

# ------------------------------------------------------------------
# 7. LOGGING (com rotacao — logs estavam em 153M)
# ------------------------------------------------------------------
# Logging automatico em toda nova janela
set-hook -g after-new-window 'run-shell "mkdir -p $HOME/.tmux/logs"' 
set-hook -ga after-new-window 'pipe-pane -o "cat >>$HOME/.tmux/logs/%Y%m%d-%H%M-#S-#I#P.log"'

# Prefix + P -> toggle logging manual
bind P pipe-pane -o "cat >>$HOME/.tmux/logs/%Y%m%d-%H%M-#S-#I#P.log" \; display-message "logging toggled"

# Prefix + shift+H nao: usar Prefix + W -> salva scrollback inteiro
bind W capture-pane -S -200000 \; save-buffer "$HOME/.tmux/logs/scrollback-#S-#I-$(date +%Y%m%d-%H%M%S).txt" \; display-message "scrollback salvo em ~/.tmux/logs/"

# Rotacao: apaga logs com mais de 7 dias sempre que o server sobe
set-hook -g session-created 'run-shell "find $HOME/.tmux/logs -type f -mtime +7 -delete 2>/dev/null || true"'

# ------------------------------------------------------------------
# 8. PERSISTENCIA (resurrect + continuum)
# ------------------------------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Diretorio de saves (explicito — o default muda se ~/.tmux/resurrect existe
# ou nao, o que confunde na hora de procurar backup)
set -g @resurrect-dir '~/.local/share/tmux/resurrect'

# Processos religados no restore. Sem isto, hermes/claude/agy voltam como
# SHELL VAZIO (a lista default so cobre vim/htop/less/etc).
#   ~   = casa em qualquer lugar do comando (hermes roda via caminho do venv)
#   ->  = comando usado no restore (--continue retoma a conversa anterior)
set -g @resurrect-processes '"~hermes-agent/venv/bin/hermes->hermes --continue" "claude->claude --continue" "agy->agy --continue" ssh htop vim nvim'

# Salva o texto visivel dos paineis (o que voce estava lendo volta na tela)
set -g @resurrect-capture-pane-contents 'on'

# Salva a cada 2 min. Com 15 min, uma queda de energia perdia ate 15 min de
# layout/janelas. O save e um .txt de ~1KB, custo irrelevante.
set -g @continuum-save-interval '2'
set -g @continuum-restore 'on'
set -g @continuum-boot 'on'
set -g @continuum-show-status 'off'

# Prefix + C-s -> salvar AGORA (antes de mexer em algo arriscado)
# Prefix + C-r -> restaurar (binds do proprio resurrect, ja ativos)
bind M-s run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "sessao salva"

# HIGIENE DOS SAVES (critico): o resurrect NAO escreve de forma atomica. Um
# crash durante a escrita deixa o save mais RECENTE com 0 bytes, e o `last`
# aponta pra ele -> restore vazio na hora que voce mais precisa.
# (Ja havia saves de 0 byte de 03/08, 07/08, 16/08 e 17/08 no disco.)
# O script apaga saves vazios, reaponta o `last` pro save valido mais novo e
# mantem so os 200 mais recentes.
set-hook -ga session-created 'run-shell -b "~/.tmux/resurrect-hygiene.sh"'
set-hook -g  client-attached 'run-shell -b "~/.tmux/redraw-pane.sh #{window_id}" ; run-shell -b "~/.tmux/resurrect-hygiene.sh"'

# ------------------------------------------------------------------
# 9. TEMA DEVSPACE
# ------------------------------------------------------------------
# O welcome em janela nova / attach vem do ~/.bashrc (bloco DevSpace), que
# distingue SSH / dentro-do-tmux / local. Nao duplicar aqui via hook: um
# `send-keys` no after-new-window escreve na linha de comando de um shell que
# talvez ainda nao subiu, e atrapalha quem abre janela pra rodar um comando.

# Prefix + E -> welcome completo COM animacao na janela atual
bind E send-keys 'DS_ANIM=1 devspace-welcome.sh' C-m
# Prefix + Y -> campo estelar (animacao) na janela atual
bind Y send-keys 'devspace-stars.sh' C-m

# TPM tem que ser a ULTIMA linha
run '~/.tmux/plugins/tpm/tpm'

# Force Dark Purple background and borders for all tmux windows/panes
set -g window-style 'bg=#120d22,fg=#f1f5f9'
set -g window-active-style 'bg=#120d22,fg=#f1f5f9'
set -g status-style 'bg=#1e1b34,fg=#b9b3d6'
set -g pane-border-style 'fg=#332f52,bg=#120d22'
set -g pane-active-border-style 'fg=#a855f7,bg=#120d22'
